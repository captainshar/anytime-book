name: Resource checks

# Weekly: find broken links and stale resource checks, and open an issue if any.
# Also runs on pull requests that touch Topic pages or resource records.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays, 13:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/docs/**'
      - 'sources/resources/**'

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check resource records (stale checks fail on the weekly run)
        id: records
        continue-on-error: true
        run: |
          node scripts/check-resources.mjs ${{ github.event_name == 'schedule' && '--strict' || '' }} 2>&1 | tee records-report.txt
          exit ${PIPESTATUS[0]}

      # Fails if a phone link dials a different number than it shows. Numbers and
      # links with no verification record are warnings (see /fact-check).
      - name: Check pages against their records
        run: node scripts/check-facts.mjs

      # Check the built site, not the sources: it resolves internal links, and
      # it skips the dead URLs that sources/resources/*.yml keeps under `dropped:`.
      - run: npm run build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Many .gov sites answer 404 to bot user agents, so send a browser one.
          args: >-
            --no-progress
            --scheme https --scheme http
            --root-dir ${{ github.workspace }}/dist
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:131.0) Gecko/20100101 Firefox/131.0'
            --max-concurrency 4
            --max-retries 2
            --accept 200..=299,403,429
            --timeout 30
            'dist/**/*.html'
          format: json
          output: lychee.json
          fail: false

      # lychee can't tell a dead page from a site that refuses automated clients
      # (consumer.ftc.gov answers 404 to it, whatever the user agent). Load every
      # failure in headless Chromium: real failures open the issue, sites that block
      # automation go on a check-by-hand list, and pages that load are dropped.
      - name: Install Chromium for the recheck
        if: steps.lychee.outputs.exit_code != 0
        run: npx playwright install --with-deps chromium

      - name: Recheck failed links in a browser
        id: recheck
        if: steps.lychee.outputs.exit_code != 0
        continue-on-error: true
        run: node scripts/recheck-links.mjs lychee.json lychee-report.md

      # The report is useful on every run, not only when an issue is opened.
      - name: Publish the recheck report
        if: steps.recheck.outcome != 'skipped'
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.recheck.outcome != 'skipped'
        with:
          name: link-recheck
          path: |
            lychee-report.md
            lychee.json

      - name: Open an issue on the weekly run
        if: github.event_name == 'schedule' && (steps.recheck.outcome == 'failure' || steps.records.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated weekly check found problems. Re-verify these resources (see sources/STYLE.md)."
            echo
            echo "## Resource records"
            echo '```'
            cat records-report.txt
            echo '```'
            echo
            echo "## Links"
            cat lychee-report.md 2>/dev/null || echo "No link failures."
          } > issue.md
          gh issue create --title "Resource check $(date +%F)" --body-file issue.md

      # On pull requests, broken links are a warning, not a failure: other
      # people's sites time out at random, and the weekly run files an issue.
      # Bad resource records still fail the check.
      - name: Report link problems on the PR
        if: github.event_name == 'pull_request' && steps.recheck.outcome == 'failure'
        run: |
          echo "::warning title=Link check::Some links still fail in a browser. See the job summary; recheck them by hand before promoting a page to verified."
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the PR check on bad resource records
        if: github.event_name == 'pull_request' && steps.records.outcome == 'failure'
        run: exit 1
