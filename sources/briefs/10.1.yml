audit: >
  Six resources, all places to find activities (library, online classes, gardening,
  museums). Nothing on how a person who was never allowed to choose finds out what
  they like, which is the Topic. Two of six resources are about gardening. Museums
  for All needs SNAP and photo ID with no alternative offered. The opening is four
  one-line sections; "Good to have first" and "This opens up" are unlinked.
reader_test:
  date: 2026-11-12
  by: claude (fresh session, page only)
  result: pass
  notes: >
    All 8 questions answered from the page. 3 of 3 readers named a Start here action first. Fixed after the test: explained thrift store, EBT, WIC, and Parks and Recreation; said what to do inside a library; added a no-internet route to Parks and Rec; added how an ordinary group answers questions before you go. Left open: nothing for a reader whose faith or family still limits what they may do (the page is written for people who left); a woman alone in a park.
