topic: "10.1"
page: src/content/docs/fun-rest-and-being-you/finding-what-you-enjoy.md
type: inner
also: skill
stage: reader-tested
reader: >
  Someone asked "What do you do for fun?" and they had no answer. Or they have free
  time for the first time and it feels empty. Growing up, what they did was assigned,
  or fun was called wasteful, worldly, or sinful.
outcome: >
  They have tried one new thing this week for no reason but curiosity, they know how
  to tell whether they liked it, and they know where free things to try can be found.
start_here: >
  Pick one thing you have been curious about and do it for 15 minutes this week.
  Afterward, ask one question: would I do that again?
constraints: [no money, no ID for a library card, no car, limited internet, guilt about spending time or money on self]
harms:
  - "People who left high-control groups are targets for recruiting. Hobby and wellness groups can be a front for MLMs or another controlling group."
  - "Subscription traps and long contracts aimed at beginners."
not_here:
  - what: "Working out your values and what you believe"
    topic: "3.5"
  - what: "Meeting people and keeping friends"
    topic: "7.3"
  - what: "Rest that isn't an activity"
    topic: "10.2"
  - what: "Scams and MLMs in detail"
    topic: "4.7"
