topic: "10.2"
page: src/content/docs/fun-rest-and-being-you/resting-without-guilt.md
type: inner
stage: reader-tested
reader: >
  They sat down on a day off and felt guilty, restless, or scared, and got back up.
  Growing up, they were valued for work, chores, service, or caring for others, and
  stopping was called lazy or sinful. They are worn out and can't seem to stop.
outcome: >
  They can rest for a short time on purpose, know what the guilt is and that it fades
  with practice, and can tell ordinary tiredness from something to get help for.
start_here: >
  Set a timer for five minutes and do one restful thing: sit, lie down, look out a
  window, listen to a song. When guilt shows up, let it be there and keep going until
  the timer ends.
constraints: [no money, no time (two jobs or kids), no private space, wary of religious or spiritual framing, stillness can bring up panic or memories]
harms:
  - "Meditation and long stillness can make trauma symptoms worse for some people. Say so, and give active options."
  - "Unlicensed coaches and supplement sellers target burned-out people."
  - "Exhaustion that doesn't lift can be a medical problem or depression. Don't let the page talk someone out of seeing a doctor."
not_here:
  - what: "Falling asleep and sleep habits"
    topic: "1.5"
  - what: "Calming panic and a body stuck on alert"
    topic: "3.2"
  - what: "The harsh inner voice"
    topic: "3.3"
  - what: "Saying no to people who want more from you"
    topic: "3.4"
