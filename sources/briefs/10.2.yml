audit: >
  Nine resources and two books. Three do other Topics' jobs (a sleep app, mental
  health screening quizzes, a crisis line as a full card). The page's one practice,
  the five-minute timer, is at the bottom. It never says what rest is or what kinds
  there are. The lead resource is a long, dense article on an undated personal site.
  Two of the picks use spiritual language that some readers leaving religion avoid.
reader_test:
  date: 2026-11-12
  by: claude (fresh session, page only)
  result: pass
  notes: >
    All 7 questions answered from the page. 3 of 3 readers named the five-minute timer first. Fixed after the test: put the see-a-provider signs on the page itself instead of behind a link; explained provider, anemia, and sleep apnea; reworded the alarm metaphor; added a line for readers whose family counts rest as selfish. Left open: no number of weeks (MedlinePlus gives none); whether 988 works in other languages; the Pete Walker article was the one resource a reader said they would never click.
