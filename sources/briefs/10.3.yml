    tested: partly
  - id: q8
    ask: "What does 'knowing how to swim' actually mean? How will I know I'm safe?"
    priority: could
    from: editor
    was: missing
    answered_in: "How you'll know you can swim"
    tested: answered
audit: >
  The strongest of the four pages: real finders, good scripts, a useful Watch out for.
  But the safety content a non-swimmer needs today is in the last section, as traps,
  and the rip current steps are inside one resource's "Good to know." Nothing on what
  a lesson is like or what to wear, which is what keeps many adults from calling.
  The review file already flagged modest swimwear as a gap (marked `lived` for that).
reader_test:
  date: 2026-11-12
  by: claude (fresh sessions, page only)
  result: fail
  notes: >
    Three tests, each by a fresh reader with only the page. All readers named the call-a-pool step first. After the first two tests the page gained a first-lesson account, plain explanations (tread water, Parks and Recreation), what to bring, and Red Cross steps for a swimmer in trouble. Still open: q4, a must. No official page says what happens at a lesson, how long it is, or what to wear, so the page gives one learner's account and the questions to ask a pool. q7: no national rule on swimwear exists; the page gives the question to ask. Both need a swim instructor's answers, or Sharon's, before this page can pass.
