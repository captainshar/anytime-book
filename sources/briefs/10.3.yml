    ask: "What happens at an adult lesson? What do I wear and bring?"
    priority: must
    from: editor
    was: missing
    answered_in: "What an adult lesson is like"
    tested: partly
  - id: q5
    ask: "What do I do if I'm in trouble in the water, or someone else is?"
    priority: must
    from: editor
    was: partly
    answered_in: ["If someone is in trouble in the water", "If you are the one in trouble", "If a rip current pulls you"]
    tested: answered
  - id: q6
    ask: "I'm scared of water. Can I still learn?"
    priority: should
    from: editor
    was: partly
    answered_in: "What an adult lesson is like"
    tested: answered
  - id: q7
    ask: "Can I cover up? What are the rules about what you wear in a pool?"
