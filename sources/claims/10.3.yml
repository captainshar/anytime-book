    section: How you'll know you can swim
    text: Get into water that's over your head and come back to the surface.
    kind: safety
    risk: medium
    verdict: confirmed
    source_url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/water-safety.html
