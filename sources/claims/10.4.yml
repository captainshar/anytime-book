topic: "10.4"
page: src/content/docs/fun-rest-and-being-you/protecting-yourself.md
claims:
  - id: c01
    section: "If someone is badly hurt: check, call, care"
    text: "Make sure the place is safe for you. Then check the person: shout, tap their shoulder, and shout again."
    kind: safety
    risk: high
    verdict: confirmed
    source_url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
    quote: CHECK the scene for safety, form an initial impression, obtain consent, and use personal protective equipment (PPE)
    more:
      - source_url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
        quote: CHECK for responsiveness, breathing, life-threatening bleeding or other life-threatening conditions using shout-tap-shout
    checked_on: 2026-11-12
    checked_by: claude
  - id: c02
    section: "If someone is badly hurt: check, call, care"
    text: "The check is quick: no more than 10 seconds."
    kind: safety
    risk: medium
    verdict: confirmed
    source_url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
    quote: "Note: CHECK for no more than 10 seconds"
    checked_on: 2026-11-12
    checked_by: claude
  - id: c03
    section: "If someone is badly hurt: check, call, care"
    text: Call 911 if the person doesn't respond, isn't fully awake, isn't breathing or is only gasping, or is bleeding badly.
    kind: safety
    risk: high
    verdict: confirmed
    source_url: https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps
    quote: If the person does not respond, responds but is not fully awake, is not breathing or is only gasping, or has life-threatening bleeding or another obvious life-threatening condition, CALL 9-1-1 and get equipment, or tell someone to do so.
    checked_on: 2026-11-12
    checked_by: claude
