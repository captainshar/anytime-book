topic: "2.1"
page: src/content/docs/safety-and-getting-started/proof-that-you-exist.md
claims:
  - id: c01
    section: "Where to get help"
    text: "Most people go in this order: a safe mailing address, then a birth certificate, then a Social Security number, then a state ID."
    kind: general
    risk: medium
    verdict: needs-human
    note: "Judgment about sequence. No source checked sets this order. SSA's ID rules (ss5doc) do not require a state ID before a Social Security number. Reviewer should decide whether this is advice or a claim."
    checked_on: 2026-10-10
    checked_by: haiku
    reviewed_by: claude
    review: agreed

  - id: c02
    section: "First, a safe place to get mail"
    text: "Many shelters, drop-in centers, legal aid offices, and some churches will hold mail for people they help."
    kind: general
    risk: medium
    verdict: unsupported
    note: "Looked at: USPS DMM 508 (General Delivery rules only), SSA request page, VoteRiders and I Am Here pages. None say shelters or churches hold mail. No web search done for this sentence."
    checked_on: 2026-10-10
    checked_by: haiku
    reviewed_by: claude
    review: agreed

