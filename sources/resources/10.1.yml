  - name: Extension Foundation - Find Cooperative Extension in Your State
    url: https://extension.org/find-cooperative-extension-in-your-state/
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://extension.org/find-cooperative-extension-in-your-state/
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: false
    notes: "Nonprofit founded by Extension directors; USDA NIFA support. Lists land-grant institutions by state. Soil-test fees vary (not verified per state; page hedges). OFF PAGE 2026-11-12 (develop pass): Gardening is now taught on the page itself (one line under Things to try). The finder page is a list of universities by state; it does not support the old page text about free advice, canning, county offices, or classes. Re-check those sentences before using this resource on any page."
  - name: Extension Master Gardener program directory
    url: https://mastergardener.extension.org/state-and-provincial-master-gardener-programs-extension-and-affiliated-program-listings/
    scope: national
    eligibility: "Varies by state program"
    cost: "Varies by state; training fee common"
    prereqs: [ application, volunteer hours ]
    source_url: https://mastergardener.extension.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: false
    notes: "Programs in 49 states + DC; volunteers average 60 hours/yr. Gemini's $100-300 fee and 18+ age not verified nationally; page says 'varies' and to ask about fee help. OFF PAGE 2026-11-12 (develop pass): Training fee, volunteer-hour commitment, and possible background check: fails the cost gate and fits this reader poorly (join, train, owe hours). Host not reachable on this pass."
  - name: Museums for All
    url: https://museums4all.org/
    scope: national
    eligibility: "People receiving SNAP benefits"
    cost: "$5 or less for up to four people per EBT card; some free"
    prereqs: [ EBT card, photo ID ]
    source_url: https://museums4all.org/
    verified_on: 2026-11-12
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Not in Gemini doc; added. 1,600+ museums; IMLS initiative administered by the Association of Children's Museums. Needs photo ID. Per-museum price and group size not verified (page says to check with the museum). 2026-11-12: Re-read museums4all.org and /for-visitors/. Page wording corrected to the site's: \"Admission is $5 or less for up to four people per EBT card\"; EBT card \"is only for identification purposes\"; \"Visitors do not need to register\"; \"Many of the participating museums will accept WIC or some other form of identification, but they are not required to do so\"."
    job: [ q4 ]
    role: backup
    fit:
      reach: 2
      barriers: 0
      readable: 2
      trust: 2
      fits_reader: 1
      actionable: 2
      note: Only for people on SNAP, and needs the EBT card plus photo ID. Clear site, nothing to join. Backup because it cannot serve a reader with no benefits or no ID.
