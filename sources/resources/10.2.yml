  - name: 988 Suicide & Crisis Lifeline
    url: https://988lifeline.org/
    phone: "988"
    text: "988"
    scope: national
    eligibility: "Anyone in the US"
    cost: free
    prereqs: []
    source_url: https://988lifeline.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "24/7/365, free, confidential. Call or text 988; chat at chat.988lifeline.org; Spanish text/chat. Gemini said 'text HOME to 988' - wrong (HOME is the Crisis Text Line keyword for 741741). Just text 988."
