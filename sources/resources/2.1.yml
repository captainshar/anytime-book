    reason: "Gemini called it national ('all 50 states'); its own site says it serves the Phoenix and Tucson, Arizona areas only."
    source_url: https://www.homelessidproject.org/
    checked_on: 2026-10-04
  - name: "National Runaway Safeline (as an ID resource)"
    reason: "Not an ID-help service; Gemini said 'under 25' and text 66008, neither on the official site. Listed in 2.2 and 2.5 instead with verified details."
    source_url: https://www.1800runaway.org/youth-teens/get-help
    checked_on: 2026-10-04
  - name: "Gemini claim: shelter-letter residency for DMV is a McKinney-Vento rule"
    reason: "Wrong. Proof-of-residency alternatives are set by each state DMV. Page says 'many states' and tells reader to ask their DMV."
    source_url: https://www.dmv.ca.gov/portal/driver-licenses-identification-cards/reduced-no-fee-id-card-program-information-for-organizations/
    checked_on: 2026-10-04
  - name: "State fee-waiver table (PA, CA, DC, NY)"
    reason: "STYLE.md forbids state-by-state tables; page tells reader to search their own state DMV for free/reduced-fee ID."
    source_url: https://www.cdc.gov/nchs/w2w/index.htm
    checked_on: 2026-10-04
  - name: Bread for the City (Washington, DC)
    reason: "DC-only mail/ID example from a news article; not verified on the org's own site and too local."
