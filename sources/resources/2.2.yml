    on_page: true
    notes: "Text SAFE and your location (city, state, or ZIP) to 4HELP (44357); or text 2Chat to 44357. 24/7. Short code 69866 does not appear anywhere — dropped. Safe Place sites: schools, fire stations, libraries, businesses (homepage)."
