    on_page: true
    notes: "ZIP or state search for food banks in the network. 'A food pantry is where people can get free food.' Staff 'may ask questions or have you fill out a form'. No ID statement on the page; page wording 'Many pantries don't need ID, but some do' is a general statement — flagged."
