    on_page: true
    notes: "Operated by Hunger Free America. Spanish: 1-877-842-6273 (1-877-8-HAMBRE). Text keywords: SNAP, EBT, Summer, food. 'These are automated texts and we do NOT reply or monitor texts.' Gemini said 7am-10pm — wrong; page says 8am-8pm ET. Old URL /usda-national-hunger-hotline redirects to /national-hunger-hotline."
