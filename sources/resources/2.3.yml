  - name: "SNAP State Directory (USDA Food and Nutrition Administration)"
    url: https://www.fna.usda.gov/snap/state-directory
    scope: national
    eligibility: "Low-income households; US citizens and certain lawfully present noncitizens; rules changed by H.R. 1 (2025)"
    cost: free
    prereqs: [interview, proof of identity]
    source_url: https://www.fna.usda.gov/snap/recipient/eligibility
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "USDA's Food and Nutrition Service is now the Food and Nutrition Administration (FNA); fns.usda.gov redirects to fna.usda.gov. Eligibility page (updated Oct 1, 2026): processing within 30 days; 'may be eligible to receive SNAP benefits within 7 days... if your household has less than $100 in liquid resources and $150 in monthly gross income, or if... income and liquid resources are less than... rent or mortgage and utilities'. Work rules: FNA implementation memo 'SNAP Provisions of the OBBB Act of 2025: ABAWD Exceptions' issued Oct 3, 2025 (usda.gov guidance portal). Per memo summaries and state manuals: time limit now ages 18-64; dependent-child exception now only for a child under 14; homeless, veteran, and former-foster-youth exceptions removed; new exception for Native Americans. CONFLICT: FNA consumer pages (work-requirements updated Jul 16 2026; eligibility updated Oct 1 2026) still list veterans/homeless/foster youth as excused, with a banner saying OBBB guidance is coming. Page follows the law/memo; flagged for Sharon. Could not open the memo PDF itself (403 / download)."
  - name: "WIC (USDA Food and Nutrition Administration)"
    url: https://www.fna.usda.gov/wic/apply
    scope: national
    eligibility: "Pregnant, recently pregnant, or breastfeeding people; children under 5; caregivers can apply for kids in their care; income rules apply"
    cost: free
    prereqs: [appointment]
    source_url: https://www.fna.usda.gov/wic
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "WIC home page lists eligibility, 'Moms, dads, foster parents, and anyone else raising kids under 5 can apply', eWIC card. Gemini's 30-day self-declaration/provisional certification detail not verified on federal page — left off."
