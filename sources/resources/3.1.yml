dropped:
  - name: Patrick Teahan (YouTube / patrickteahan.com)
    reason: "Real free content, but his own site does not state his license type; Gemini's 'LCSW' unconfirmed. Creator endorsement is Sharon's call. Kept off page for now."
    source_url: https://www.patrickteahan.com/about
    checked_on: 2026-10-04
  - name: Childhelp National Child Abuse Hotline
    reason: "Own pages say 'anyone affected by child abuse' but never clearly say adult survivors are served; confidentiality has a reporting exception. Better fit for 9.2 (siblings still at home)."
    source_url: https://childhelphotline.org/how-it-works/
    checked_on: 2026-10-04
  - name: CPTSD Foundation
    reason: "Mix of free and paid tiers ($4.99–$99/mo per Gemini); not verified in time. Sharon to decide if the free peer chat is worth listing."
    source_url: https://cptsdfoundation.org/cptsd-resources/
    checked_on: 2026-10-04
  - name: Homeschool Alumni Reaching Out (HARO) / Homeschoolers Anonymous
    reason: "Homeschoolers Anonymous is an archived blog; last post March 2018. No HARO activity found after 2016."
    source_url: https://homeschoolersanonymous.net/
    checked_on: 2026-10-04
  - name: OpenCounseling directory
    reason: "Third-party aggregator, not an official source; use FindTreatment.gov / HRSA finders instead (see 3.4)."
    source_url: https://www.opencounseling.com/
    checked_on: 2026-10-04
  - name: Public libraries (generic)
    reason: "Not a single resource; library access is covered in Area 1 / 8. Book links here go to publisher or WorldCat."
    source_url: https://libbyapp.com/
    checked_on: 2026-10-04
