  - name: UCLA Mindful free guided meditations
    url: https://www.uclahealth.org/programs/marc/free-guided-meditations/guided-meditations
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [internet or app]
    source_url: https://www.uclahealth.org/programs/marc/free-guided-meditations/guided-meditations
