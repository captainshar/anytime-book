topic: "3.2"
resources:
  - name: PTSD Coach (app) and PTSD Coach Online
    url: https://www.ptsd.va.gov/appvid/mobile/ptsdcoach_app.asp
    scope: national
    eligibility: "Anyone coping with stress or trauma; no military service or diagnosis needed"
    cost: free
    prereqs: [smartphone or computer]
    source_url: https://www.ptsd.va.gov/appvid/mobile/ptsdcoach_app.asp
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "VA National Center for PTSD. iOS/Android. Web version https://www.ptsd.va.gov/apps/ptsdcoachonline/ (no login). Not a replacement for care."
  - name: iChill (app)
    url: https://www.traumaresourceinstitute.com/ichill
    scope: national
    eligibility: "Children, teens, adults"
    cost: free
    prereqs: [smartphone or internet]
    source_url: https://www.traumaresourceinstitute.com/ichill
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Trauma Resource Institute; Community Resiliency Model skills; English, Arabic, Spanish, Hebrew, Ukrainian. ichillapp.com did not respond to a scripted check, so the page links the TRI page."
  - name: Virtual Hope Box (app)
    url: https://mobile.health.mil/Apps/Native-Apps/Virtual-Hope-Box
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [smartphone]
    source_url: https://mobile.health.mil/Apps/Native-Apps/Virtual-Hope-Box
