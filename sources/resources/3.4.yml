  - name: SAMHSA National Helpline and FindTreatment.gov
    url: https://www.samhsa.gov/find-help/helplines/national-helpline
    phone: "1-800-662-4357"
    text: "435748 (text your ZIP code)"
    scope: national
    eligibility: "Anyone facing mental health or substance use issues, or their family"
    cost: free
    prereqs: []
    source_url: https://www.samhsa.gov/find-help/helplines/national-helpline
