    reason: "Restored Sept 30 2026 (four days before this check), but HHS declined to say trans and nonbinary youth will be affirmed. Not listed until Sharon decides how to present it."
    source_url: https://www.thetrevorproject.org/blog/the-trevor-project-applauds-the-return-of-the-988-lifelines-press-3-specialized-services-for-lgbtq-youth/
