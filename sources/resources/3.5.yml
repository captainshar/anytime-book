    risk: low
    on_page: true
    notes: "Member directory loaded with 311 centers. Services vary by center."
  - name: 988 Suicide & Crisis Lifeline
    url: https://988lifeline.org/
    phone: "988"
    text: "988"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://988lifeline.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "Listed only as the general line. LGBTQ+ youth 'Press 3' ended July 17 2025 and was restored Sept 30 / Oct 1 2026 (988 homepage + Trevor Project blog + Advocate). HHS would not confirm trans callers' names/pronouns will be respected; Trevor no longer a provider. Kept OFF the page pending Sharon's decision — see review file."
dropped:
