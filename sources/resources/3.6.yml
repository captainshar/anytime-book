    on_page: true
    notes: "Marlene Winell, PhD, coined 'Religious Trauma Syndrome' (2011). Article does not claim RTS is an official diagnosis; page says so plainly. Winell's Journey Free sells 'coaching' — the book warns about coaches; Sharon check the tension."
