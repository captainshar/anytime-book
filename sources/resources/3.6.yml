topic: "3.6"
resources:
  - name: Recovering from Religion — peer support line, chat, support groups
    url: https://www.recoveringfromreligion.org/
    phone: "844-368-2848"
    hours: "Aims for 24 hours; if no agent, schedule a call or chat"
    scope: national
    eligibility: "Anyone doubting, leaving, or hurt by religion; LGBTQ+ explicitly welcome"
    cost: free
    prereqs: []
    source_url: https://www.recoveringfromreligion.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "844-I-DOUBT-IT. Text chat via green bubble bottom-left. Scheduled calls need 72 hours' notice. Groups free, virtual, monthly, anonymous, cameras optional; specialty groups incl. LGBTQA+, youth 16-25, women, men, parents, Spanish-speaking (recoveringfromreligion.org/support-groups). Groups' 'no cost' stated; peer line cost not printed but no fees anywhere. Secular (not religious) org — values flag for Sharon."
  - name: Secular Therapy Project
    url: https://www.seculartherapy.org/
    scope: national
    eligibility: "Anyone wanting non-religious, evidence-based therapy"
    cost: "Directory free; therapists set their own fees"
    prereqs: [email, country, ZIP/postal code, money or insurance for sessions]
    source_url: https://www.seculartherapy.org/faq
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Run by Recovering from Religion. Therapists screened by licensed evaluators for licensure, evidence-based practice, secular approach. Telehealth options listed."
  - name: International Cultic Studies Association (ICSA)
    url: https://internationalculticstudies.org/resources-for-survivors-families-friends/
    scope: national
    eligibility: "Former members of cultic or high-control groups, including people born or raised in them; families"
    cost: free
    prereqs: [internet]
    source_url: https://internationalculticstudies.org/resources-for-survivors-families-friends/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Free online library, articles, checklists, survivor stories, video series for second-generation former members, professional directory. ICSA states it does not provide counseling or direct services. 2026 conference listed. Recovery workshops exist (screened, likely paid) — not put on page."
  - name: Footsteps
    url: https://www.footstepsorg.org/what-we-offer/
    phone: "877-783-7755"
    scope: national
    serves_where: "Based in New York; remote programs offered nationally"
    eligibility: "People who have left or are thinking of leaving ultra-Orthodox Jewish communities"
    cost: "Not stated on page; ask"
    prereqs: []
    source_url: https://www.footstepsorg.org/what-we-offer/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "877-STEPS-55; connect@footstepsorg.org; reply within 72 hours; meeting staff does not obligate you to join. Social/emotional support, education and career help, legal support, peer programs."
  - name: Ex-Muslims of North America — emergency help
    url: https://exmuslims.org/get-help/
    scope: national
    serves_where: "United States and Canada"
