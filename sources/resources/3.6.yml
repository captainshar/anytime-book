    on_page: true
    notes: "Short-term shelter, transportation, coordination. Contact by email address on the page (obfuscated by Cloudflare in fetch; not printed on our page — link only). EXMNA says it no longer runs support communities directly; affiliate groups listed (Toronto, Chicago, DC, Florida, Pacific NW). Cost 'free' not printed; emergency aid model. Sharon check."
