  - name: Financial Counseling Association of America (FCAA)
    url: https://www.fcaa.org/
    phone: "800-450-1794"
    scope: national
    eligibility: "Anyone; member agencies in all 50 states and Puerto Rico"
    cost: "Initial conversation free; some services have fees"
    prereqs: []
    source_url: https://www.fcaa.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "501(c)(3) association. Header number (800) 450-1794 is the consumer line; 866-278-1567 is labeled 'Office'. 'Find a Credit Counselor' form routes to a member agency."
  - name: CFPB complaint portal
    url: https://www.consumerfinance.gov/complaint/
    phone: "855-411-2372"
    hours: "Mon-Fri 9am-6pm ET, except federal holidays; TTY 855-729-2372"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://www.consumerfinance.gov/complaint/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "Despite 2025 CFPB cuts, portal is operating: accepts complaints on checking/savings, credit cards, credit reports, debt collection, debt management, money transfers, payday/personal loans, prepaid cards, student loans, vehicle loans, mortgages. 'Most companies respond within 15 days.' Hours from https://www.consumerfinance.gov/about-us/contact-us/."
  - name: "FTC: How to get out of debt"
    url: https://consumer.ftc.gov/articles/how-get-out-debt
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://consumer.ftc.gov/articles/how-get-out-debt
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: false
    notes: "Updated Dec 2025. Source for 'only scammers collect fees before settling debts' and 'stop paying/stop communicating' red flags. CPN/new credit identity warning from FTC alerts (consumer.ftc.gov/consumer-alerts/2025/12/looking-fix-your-credit-illegal-credit-repair-scam-isnt-answer)."
