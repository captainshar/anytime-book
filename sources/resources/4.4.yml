topic: "4.4"
resources:
  - name: AnnualCreditReport.com
    url: https://www.annualcreditreport.com/
    phone: "877-322-8228"
    scope: national
    eligibility: "Anyone; free weekly reports from each bureau"
    cost: free
    prereqs: [SSN or ITIN, identity questions]
    source_url: https://consumer.ftc.gov/articles/free-credit-reports
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "AnnualCreditReport.com blocks scripted fetches (403 / JS-rendered), so verified via FTC article (updated June 2026): only authorized site; weekly free reports from each bureau; phone 1-877-322-8228."
  - name: Equifax credit freeze
    url: https://www.equifax.com/personal/credit-report-services/credit-freeze/
    phone: "888-298-0045"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [identity verification, myEquifax account for online]
    source_url: https://www.equifax.com/personal/credit-report-services/credit-freeze/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "Equifax page: 'manage your freeze by phone: call us at (888) 298-0045'. Experian's page lists a different Equifax number (1-888-378-4329); page uses Equifax's own. Free + no score impact confirmed by FTC (https://consumer.ftc.gov/articles/what-know-about-credit-freezes-and-fraud-alerts, updated Aug 2025)."
  - name: Experian credit freeze
    url: https://www.experian.com/freeze/center.html
    phone: "888-397-3742"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [identity verification]
    source_url: https://www.experian.com/freeze/center.html
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "1-888-EXPERIAN (1-888-397-3742) to add or remove a freeze by phone."
  - name: TransUnion credit freeze
    url: https://www.transunion.com/credit-freeze
    phone: "888-909-8872"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [identity verification]
    source_url: https://www.transunion.com/credit-freeze/mail-or-phone
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "transunion.com returns 403 to scripted fetches. Number confirmed from transunion.com search snippets (freeze/mail-or-phone and FAQ pages): automated freeze line 888-909-8872; representative 800-916-8800. Sharon: open the TransUnion freeze page in a browser to confirm."
  - name: IdentityTheft.gov
    url: https://www.identitytheft.gov/
    phone: "877-438-4338"
    hours: "Interpreters (press 3) 9am-5pm ET"
    scope: national
    eligibility: "Anyone whose information was misused"
    cost: free
    prereqs: []
    source_url: https://consumer.ftc.gov/consumer-alerts/2024/09/how-recover-identity-theft
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "identitytheft.gov is JS-rendered; verified via FTC consumer alert and FTC contact page. Creates Identity Theft Report + recovery plan with pre-filled letters."
  - name: "CFPB: How do I dispute an error on my credit report?"
    url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-dispute-an-error-on-my-credit-report-en-314/
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-dispute-an-error-on-my-credit-report-en-314/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Live as of 2026-10-04: dispute with credit reporting company first, then the furnisher; sample letters; certified mail suggested."
