    prereqs: [photo ID (often), proof of address (often)]
    source_url: https://www.toollibraryalliance.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Volunteer-run (fiscal sponsor Shareable). Map says it's 'a work in progress and not a comprehensive resource.' localtools.org/find (myTurn) points to the same map. ID/address rules are typical, per Gemini; not confirmed per library, so page says 'often.'"
