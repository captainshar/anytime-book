dropped:
  - name: Habitat Learns (Habitat for Humanity)
    reason: "Free, but it's an orientation and training platform for Habitat volunteers and staff, not beginner home-repair lessons for renters."
    source_url: https://www.habitat.org/about/habitat-learns
    checked_on: 2026-10-04
  - name: HUD Healthy Homes maintenance checklist
    reason: "hud.gov/healthyhomes loads with no content. The checklist PDF is on nchh.org; not checked as current."
    source_url: https://www.hud.gov/healthyhomes
    checked_on: 2026-10-04
  - name: This Old House
    reason: "Commercial, ad-heavy, aimed at homeowners doing renovations. Not a fit for beginner renters; three free beginner channels cover the need."
    source_url: https://www.thisoldhouse.com/
    checked_on: 2026-10-04
  - name: toollibraryfinder.com
    reason: "Unknown operator; used the Tool Library Alliance map instead."
    source_url: https://toollibraryfinder.com/
    checked_on: 2026-10-04
