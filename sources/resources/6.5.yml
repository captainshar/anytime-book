topic: "6.5"
resources:
  - name: HealthCare.gov Find Local Help
    url: https://www.healthcare.gov/find-local-help/
    phone: "1-800-318-2596"
    hours: "24/7 except holidays"
    scope: national
    eligibility: "Anyone needing help with Marketplace or Medicaid applications"
    cost: free
    prereqs: []
    source_url: https://www.healthcare.gov/contact-us/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "TTY 1-855-889-4325. Assisters/navigators free and non-biased; agents/brokers 'generally paid by insurance companies' (https://www.healthcare.gov/apply-and-enroll/get-help-applying/)."
  - name: Medicaid.gov — Where can people get help with Medicaid & CHIP
    url: https://www.medicaid.gov/about-us/where-can-people-get-help-medicaid-chip
    scope: national
    eligibility: "Varies by state"
    cost: free
    prereqs: [identity, income, citizenship or immigration status]
    source_url: https://www.medicaid.gov/about-us/where-can-people-get-help-medicaid-chip
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "State map with agency links and phones. Medicaid can be applied for any time (healthcare.gov dates page)."
  - name: HealthCare.gov Marketplace (dates and deadlines)
    url: https://www.healthcare.gov/quick-guide/dates-and-deadlines/
    phone: "1-800-318-2596"
    scope: national
    eligibility: "US citizens, nationals, lawfully present"
    cost: "varies by income"
    prereqs: [SSN if eligible, income estimate, identity verification]
    source_url: https://www.healthcare.gov/quick-guide/dates-and-deadlines/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "Open Enrollment Nov 1–Jan 15 (for 2027 coverage); SEP Jan 16–Oct 31 only with life event. Low-income (≤150% FPL) monthly SEP repealed per CMS 2025 Marketplace Integrity rule (https://www.cms.gov/newsroom/press-releases/cms-finalizes-major-rule-lower-individual-health-insurance-premiums-americans); enhanced PTCs expired end of 2025 per CMS docs ('expire at the end of 2025 absent Congressional action'). Could not find a HealthCare.gov page stating the expiration in plain words — see review."
  - name: SNAP State Directory of Resources (USDA FNA)
    url: https://www.fna.usda.gov/snap/state-directory
    scope: national
    eligibility: "Low-income households; state determines"
    cost: free
    prereqs: [identity for expedited service]
    source_url: https://www.fna.usda.gov/snap/state-directory
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "USDA FNS is now 'Food and Nutrition Administration' at fna.usda.gov. Expedited service (7 days; <$150 gross income and ≤$100 liquid resources; or income+resources < rent+utilities; or destitute migrant/seasonal with ≤$100) confirmed in 7 CFR 273.2(i) text (https://www.law.cornell.edu/cfr/text/7/273.2; ecfr.gov blocked). ABAWD changes per FNA OBBB ABAWD exceptions implementation memo (issued Oct 3, 2025; https://www.usda.gov/guidance-documents/snap/fns/snap-provisions-one-big-beautiful-bill-act-2025-abawd-exceptions-implementation-memorandum): removes homeless/veteran/former-foster-youth exceptions, age through 64, dependent child under 14. NOTE: fna.usda.gov/snap/work-requirements (updated July 16, 2026) still shows OLD rules with a 'guidance pending' note."
  - name: USDA National Hunger Hotline (Hunger Free America)
    url: https://www.hungerfreeamerica.org/en-us/national-hunger-hotline
    phone: "1-866-348-6479"
    text: "914-342-7744"
    hours: "Mon–Fri 8 a.m.–8 p.m. ET"
    scope: national
    eligibility: "Anyone seeking food"
    cost: free
    prereqs: []
    source_url: https://www.hungerfreeamerica.org/en-us/national-hunger-hotline
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Spanish 1-877-842-6273. Text line is automated keywords (SNAP, EBT, Summer, food); not monitored. Gemini's '97779' was wrong."
  - name: Social Security — SSI and Disability
    url: https://www.ssa.gov/ssi
    phone: "1-800-772-1213"
    hours: "Mon–Fri 8 a.m.–7 p.m. local time"
