    notes: "Checked entries: premium, deductible, co-payment, network, in-network coinsurance, out-of-pocket maximum, HMO, PPO, EPO, HDHP, HSA, FSA. HSA carryover/portability from IRS Pub 969 (https://www.irs.gov/publications/p969). FSA: grace period 2.5 months OR carryover (up to $640 per glossary)."
