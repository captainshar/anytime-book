  - name: HHS HIPAA Privacy Rule summary — confidential communications
    url: https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html
    scope: national
    eligibility: "Anyone covered by a HIPAA health plan or provider"
    cost: free
    prereqs: [written request may be required, alternate address or contact]
    source_url: https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "'Health plans must accommodate reasonable requests if the individual indicates that the disclosure... could endanger the individual. The health plan may not question the individual's statement of endangerment.' Content last reviewed March 14, 2025. Used in tip box (6.5 and 6.6). 'In writing' is plan-specific (45 CFR 164.522(b)(2) allows plans to require writing) — not re-read in eCFR (blocked)."
  - name: CMS Medicaid community engagement interim final rule fact sheet
    url: https://www.cms.gov/newsroom/fact-sheets/medicaid-community-engagement-requirement-certain-individuals-interim-final-rule-comment-period-cms
    scope: national
    eligibility: "Expansion-group adults 19–64, non-pregnant, not on Medicare"
    cost: free
    prereqs: []
    source_url: https://www.cms.gov/newsroom/fact-sheets/medicaid-community-engagement-requirement-certain-individuals-interim-final-rule-comment-period-cms
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: false
    notes: "Fact sheet June 1, 2026: 80 hrs/month or income ≥80×federal minimum wage ($580/mo); states implement by Jan 1, 2027 (earlier allowed); verify at application and renewal; 30 days to show compliance after notice; can reapply. Exemptions listed. 6-month renewals for expansion adults from renewals on/after Jan 1, 2027 (Section 71107; SMDL #26-001, https://www.medicaid.gov/federal-policy-guidance/downloads/smd26001.pdf, via search). Background source for page text."
