topic: "7.2"
resources:
  - name: 211
    url: https://www.211.org/
    phone: "211"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://www.unitedway.org/our-impact/community-resiliency/211-connecting-people-to-local-resources
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "211.org says 24/7 and confidential; United Way says free, 180 languages, reachable by about 99% of US. Text/chat options vary by local 211 — Gemini's 'text ZIP to 898-211' is not universal, so not published."
  - name: USAGov contact center
    url: https://www.usa.gov/phone
    phone: "1-844-872-4681"
    hours: "Mon-Fri 8 a.m.-8 p.m. ET, except federal holidays"
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://www.usa.gov/phone
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "1-844-USA-GOV1. Helps find the right federal agency/program. Chat at usa.gov/chat."
  - name: Social Security Administration
    url: https://www.ssa.gov/manage-benefits/make-an-appointment
    phone: "1-800-772-1213"
    hours: "Mon-Fri 8 a.m.-7 p.m. local time; automated service 24/7"
    scope: national
    eligibility: "Anyone with Social Security business (cards, benefits, SSI)"
    cost: free
    prereqs: []
    source_url: https://www.ssa.gov/agency/contact/phone.html
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: "TTY 1-800-325-0778. Online appointment scheduler at ssa.gov/manage-benefits/make-an-appointment (appointment may be phone or in person). Since Jan 6 2025 field offices are appointment-focused; SSA says it will still serve walk-ins it can, especially vulnerable people (ssa.gov/news/en/advocates/2024-11-13.html, seen in search results only). Waits shorter in mornings, later in the week and month. Reconsideration deadline: 60 days after decision (ssa.gov/apply/appeal-decision-we-made/request-reconsideration)."
  - name: LawHelp.org
    url: https://www.lawhelp.org/
    scope: national
    eligibility: "Anyone can read; free lawyers are usually limited to people with low income (rules set by each local program)"
    cost: free
    prereqs: [internet]
    source_url: https://www.lawhelp.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Run by Pro Bono Net with legal aid partners; 'always free to use'. Choose your state for local guides, forms, and legal aid directory."
  - name: Legal Services Corporation (LSC) legal aid finder
    url: https://www.lsc.gov/about-lsc/what-legal-aid/i-need-legal-help
    scope: national
    eligibility: "Low-income people (each program sets its own rules)"
    cost: free
    prereqs: []
    source_url: https://www.lsc.gov/about-lsc/what-legal-aid/i-need-legal-help
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Enter an address or city to find an LSC-funded legal aid office. Funds 129 organizations in every state, DC, and territories."
  - name: ABA Free Legal Answers
    url: https://abafreelegalanswers.org/
    scope: national
    serves_where: "40+ states and territories; not available in some (site listed CO, DE, KY, NV, OH, RI, WA, WY as absent)"
    eligibility: "Low-income adults with a civil (not criminal) question; answer qualifying questions"
    cost: free
    prereqs: [email, internet, account]
    source_url: https://abafreelegalanswers.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Type a question; a volunteer lawyer answers by message. Must create an account. Absent-states list came from a page summary — wording on page says 'not every state' rather than naming states."
  - name: Community Action Partnership — Find a Community Action Agency
    url: https://communityactionpartnership.com/find-a-cap/
    scope: national
    eligibility: "Mostly low- and moderate-income people; local rules vary"
    cost: free
    prereqs: []
    source_url: https://communityactionpartnership.com/find-a-cap/
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Search by ZIP, state, county. Local agencies help with energy bills (LIHEAP), and other anti-poverty programs; getting money usually needs proof of ID and income."
