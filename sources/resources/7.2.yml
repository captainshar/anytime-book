    reason: "Gemini cited a 2008-era CMS fact sheet; Medicaid rules are changing under H.R. 1. Not verified; belongs in 2.1 / 6.5."
    source_url: https://www.cms.gov/newsroom/fact-sheets/medicaid-citizenship-guidelines
    checked_on: 2026-10-04
  - name: Public library social workers
    reason: "Real but only in some library systems; no national finder. Mentioned as a tip ('ask at the desk'), not as a listed resource."
    source_url: https://www.ala.org/pla/resources/tools/homelessness
    checked_on: 2026-10-04
