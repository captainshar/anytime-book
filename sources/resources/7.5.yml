  - name: Swipe Safely digital dating guide (NNEDV Safety Net Project)
    url: https://www.techsafety.org/swipe-safely
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [internet]
    source_url: https://www.techsafety.org/swipe-safely
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "(c) 2025, with eleven24. Tips: watch what photos reveal, avoid live location tags, don't share number/address early, watch for money talk and love-bombing, meet in public, own transportation, tell a friend. This is the current dating-app safety guidance used on the page."
  - name: Cyber Civil Rights Initiative (CCRI) Crisis Helpline
