resources:
  - name: Scarleteen
    url: https://www.scarleteen.com/
    text: "206-866-2279"
    scope: national
    eligibility: "Ages 13 and up for direct services; text line US only"
    cost: free
    prereqs: []
    source_url: https://www.scarleteen.com/ask
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Text (206) 866-2279 for quick questions, 24/7 most days (closed listed holidays); message/data rates apply. Message boards; live chat Mon 8-10 pm CST and Sun 12-3 pm CST. Aimed at teens and young adults but useful for adults who missed sex ed. Tagline 'Queer Sex Ed For All Since 1998'."
  - name: Bedsider
