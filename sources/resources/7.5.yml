  - name: Title X Family Planning Clinic Locator (HHS)
    url: https://reproductivehealthservices.gov/
    phone: "1-877-696-6775"
    scope: national
    eligibility: "Anyone"
    cost: "Low-cost or free depending on income (sliding scale per Title X rules; not stated on locator page)"
    prereqs: []
    source_url: https://reproductivehealthservices.gov/
    verified_on: 2026-10-04
    verified_by: claude
    risk: medium
    on_page: true
    notes: "Locator live (v1.4.5). Services listed: family planning, HPV vaccine, PrEP, cancer screening, IPV screening. Phone is the general HHS line, not clinic help — not published. 2025 Title X funding was withheld from some grantees, so some listed clinics may have closed or changed — page says call first. Cost wording comes from Title X regulations (42 CFR 59.5), not re-opened; flag for Sharon."
