    url: https://www.nlrb.gov/about-nlrb/rights-we-protect/your-rights
    phone: "1-844-762-6572"
    scope: national
    eligibility: "Most private-sector employees"
    cost: free
    prereqs: []
    source_url: https://www.nlrb.gov/about-nlrb/rights-we-protect/your-rights
