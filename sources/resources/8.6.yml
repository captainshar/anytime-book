  - name: Equal Employment Opportunity Commission (EEOC)
    url: https://www.eeoc.gov/how-file-charge-employment-discrimination
    phone: "1-800-669-4000"
    scope: national
    eligibility: "Job applicants and workers; most laws cover employers with 15+ employees"
