    on_page: true
    notes: "TTY 1-800-669-6820; ASL video 1-844-234-5122. 180 days, extended to 300 where a state/local agency enforces a similar law. The 15-employee threshold is general knowledge (the fetch summary was not certain); the age law covers 20+. The page lists religion, race, sex, disability, age 40+; it leaves out the EEOC's current position on sexual orientation and gender identity on purpose, because that has shifted in 2025 - Sharon should check."
