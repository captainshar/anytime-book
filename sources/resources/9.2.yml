    on_page: true
    notes: >-
      NNEDV project, funded in part by a DOJ Office for Victims of Crime grant. Email hotline: every email answered or
      reviewed by an attorney; response in 1-5 business days; legal information, not advice; cannot call you;
      accounts deleted after 90 days. Homepage has "Know the Laws - By State."
