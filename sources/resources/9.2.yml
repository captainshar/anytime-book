    source_url: https://www.sos.mo.gov/business/SafeAtHome/AddressConfidentialityProgramsByState
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: >-
      Gemini's 38-number state table NOT published. Directory shows Arkansas offers confidentiality only for
      driver's license records; South Carolina has an ACP through the Attorney General; Rhode Island's number is
      401-222-5149 (Gemini gave New Jersey's). techsafety.org also keeps a 'State Address Confidentiality Programs' page.
  - name: Police missing-adult policies (LAPD, Las Vegas Metro PD, Phoenix PD)
    url: https://www.lapdonline.org/faqs-missing-persons/
    scope: local
    serves_where: "Los Angeles, Las Vegas, Phoenix (cited as examples of a common policy)"
    eligibility: "n/a - cited as examples"
    cost: free
    prereqs: []
    source_url: https://www.lvmpd.com/services/missing-persons/adults
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: >-
      LAPD and LVMPD: police notify the reporter once the person is found but "cannot disclose the location or
      whereabouts of the missing person without that person's consent" (LVMPD adds "unless the person requesting has
      court-appointed guardianship"). Phoenix PD: "We will not reveal the whereabouts of an adult missing person."
      LVMPD: "Being a missing person is not a crime." The book generalizes cautiously and names LA and Las Vegas as
      examples. Not a national rule. Needs advocate or lawyer review.
  - name: FCC Safe Connections - Separate Your Phone Line
    url: https://www.fcc.gov/consumers/guides/how-request-phone-line-separation-abusers-account
    scope: national
    eligibility: "Survivors of DV, dating violence, stalking, sexual assault, trafficking, or similar crimes; need not be the account holder"
    cost: free
    prereqs: [document naming the survivor and the abuser]
    source_url: https://www.fcc.gov/consumers/guides/how-request-phone-line-separation-abusers-account
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: >-
      Verified in browser (fetch returned 403). Last reviewed Sept 29, 2025. Provider must usually process within two
      business days; no early termination fees; Lifeline emergency support up to 6 months for survivors with
      financial hardship. Accepted documents include affidavits from medical, mental health, social work, or victim
      services providers, police reports, and protective orders.
