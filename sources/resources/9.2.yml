topic: "9.2"
resources:
  - name: National Domestic Violence Hotline
    url: https://www.thehotline.org/
    phone: "1-800-799-7233"
    text: "START to 88788"
    scope: national
    eligibility: "Anyone experiencing or worried about abuse"
    cost: free
    prereqs: []
    source_url: https://www.thehotline.org/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: >-
      Homepage: "Free. Confidential. 24/7"; call 800.799.SAFE (7233), text START to 88788, live chat; AI chat "Ruth" when
      advocates are busy; banner warns of high demand and long waits. Interactive safety plan tool at
      /plan-for-safety/create-your-personal-safety-plan/. The Hotline's framing is mainly relationship (partner) abuse;
      the book says you can call about family abuse too. Sharon/advocate to confirm wording. Note: the FCC Safe
      Connections page misprints the Hotline as 1-888-799-SAFE; the correct number is 1-800-799-7233.
