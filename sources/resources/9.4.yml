    serves_where: "California"
    eligibility: "Income-eligible California drivers; vehicle value limit $25,000; driving record rules"
    cost: low-cost
    prereqs: [California driver's license, proof of income]
    source_url: https://www.insurance.ca.gov/01-consumers/105-type/95-guides/01-auto/lca/
