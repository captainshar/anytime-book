    notes: "Yo-yo financing page (ask-cfpb en-831, last reviewed Mar 8, 2024): 'Make sure the financing is final before you take the car home'; describes spot delivery / conditional financing."
  - name: California Low Cost Auto Insurance (CLCA)
    url: https://www.insurance.ca.gov/01-consumers/105-type/95-guides/01-auto/lca/
    phone: "1-866-602-8861"
