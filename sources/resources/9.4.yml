topic: "9.4"
resources:
  - name: USAGov - State motor vehicle services
    url: https://www.usa.gov/state-motor-vehicle-services
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [internet]
    source_url: https://www.usa.gov/state-motor-vehicle-services
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Official finder for each state's DMV. Used instead of state-by-state links. State manuals are free on each DMV site."
  - name: Texas DPS - adult driver education requirement (example on page)
    url: https://www.dps.texas.gov/section/driver-license/choosing-driver-education-course
    scope: state
    serves_where: "Texas"
    eligibility: "Ages 18-24 must take a 6-hour adult driver education course before testing; 25+ not required"
    cost: "varies by course"
    prereqs: []
    source_url: https://www.dps.texas.gov/section/driver-license/choosing-driver-education-course
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Cited in text as an example that some states add steps for young adults. Gemini said adults are 'generally exempt'; that is not true everywhere."
  - name: FTC - Buying a used car from a dealer
    url: https://consumer.ftc.gov/articles/buying-used-car-dealer
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: []
    source_url: https://consumer.ftc.gov/articles/buying-used-car-dealer
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Buyers Guide shows warranty or 'as is'; advises independent mechanic inspection and vehicle history report."
  - name: NMVTIS (National Motor Vehicle Title Information System)
    url: https://vehiclehistory.bja.ojp.gov/
    scope: national
    eligibility: "Anyone"
    cost: "set by each approved provider"
    prereqs: [VIN]
    source_url: https://vehiclehistory.bja.ojp.gov/nmvtis_vehiclehistory
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "vehiclehistory.gov redirects here. 'Research Vehicle History' page lists Approved NMVTIS Data Providers. Report covers title, latest odometer, brand history, sometimes theft. No price stated on the official site, so none published."
  - name: NHTSA recall lookup
    url: https://www.nhtsa.gov/recalls
    scope: national
    eligibility: "Anyone"
    cost: free
    prereqs: [VIN]
    source_url: https://www.nhtsa.gov/recalls
    verified_on: 2026-10-04
    verified_by: claude
    risk: low
    on_page: true
    notes: "Not in Gemini doc. NHTSA monitors recalls so owners receive 'safe, free, and effective remedies.'"
  - name: CFPB - Auto loans
    url: https://www.consumerfinance.gov/consumer-tools/auto-loans/
    scope: national
    eligibility: "Anyone"
    cost: free
