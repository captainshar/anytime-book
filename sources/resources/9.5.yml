resources:
  - name: Title X Family Planning Clinic Locator (HHS Office of Population Affairs)
    url: https://reproductivehealthservices.gov/
    scope: national
    eligibility: "Anyone; costs based on income"
    cost: "free or low-cost (sliding fee)"
    prereqs: [ZIP code or city]
    source_url: https://reproductivehealthservices.gov/
    verified_on: 2026-10-04
    verified_by: claude
    risk: high
    on_page: true
    notes: >-
      Locator live (verified in browser). 2025-26 changes: FY2026 appropriations (signed Feb 3, 2026) kept about $286.5M
      for Title X, but HHS delayed continuation awards and changed priorities; HHS withheld Title X funds from some
      grantees in 2025; 57 Planned Parenthood clinics closed or consolidated since Jan 2025 (KFF, search result).
      Page tells readers to call first. Gemini's "legally prohibited from turning a patient away" and "parallel charts"
      claims not verified on OPA's own pages; page says "tell the clinic" instead.
