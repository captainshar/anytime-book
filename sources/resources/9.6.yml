    reason: "Not found on CFPB pages; not published. Page says 'don't agree to pay anything until you check.'"
    source_url: https://www.consumerfinance.gov/ask-cfpb/can-a-debt-collector-contact-me-about-a-deceased-relatives-debts-en-1469/
    checked_on: 2026-10-04
  - name: Gemini claim that the FTC is about to require online funeral price posting
    reason: "Rulemaking status not verified; omitted."
